name: Build Android (EAS)

# Lance un build EAS depuis GitHub, sans machine de développement : tout se
# déclenche depuis l'onglet Actions (utilisable depuis un téléphone).
#
# Prérequis, à configurer une seule fois :
#   1. Compte Expo (https://expo.dev) — gratuit.
#   2. Jeton d'accès : expo.dev → Account settings → Access tokens →
#      "Create token". À enregistrer dans GitHub → Settings → Secrets and
#      variables → Actions → New repository secret, sous le nom EXPO_TOKEN.
#   3. Clé Google Maps : expo.dev → le projet → Secrets → "Create" →
#      nom GOOGLE_MAPS_API_KEY_ANDROID. Elle est injectée par app.config.js
#      pendant le build sur les serveurs EAS ; elle ne transite jamais par
#      GitHub ni par le dépôt.
#
# Le build s'exécute sur l'infrastructure d'Expo. Ce workflow ne fait que le
# déclencher (`--no-wait`) : il se termine en quelques minutes, tandis que le
# build lui-même se poursuit et peut rester en file d'attente sur l'offre
# gratuite. Suivi et téléchargement de l'AAB sur https://expo.dev.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profil EAS (production = AAB pour le Play Store)"
        default: production
        type: choice
        options:
          - production
          - preview

jobs:
  build:
    name: Déclencher le build EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TuniTransport

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TuniTransport/package-lock.json

      - name: Installer EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Installer les dépendances
        run: npm ci

      - name: Lancer le build
        run: |
          eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait

      - name: Où suivre le build
        run: |
          echo "Build lancé sur les serveurs EAS."
          echo "Suivi et téléchargement de l'AAB : https://expo.dev → votre projet → Builds"
